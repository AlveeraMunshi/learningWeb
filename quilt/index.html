<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Side Quest Quilt</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="quilt">
    <div class="block solid legendary r0"></div>
    <div class="block triangle sunset r0"></div>
    <div class="block quarter aqua r0"></div>
    <div class="block stripe candy r0"></div>
    <div class="block nine jewel r0"></div>
    <div class="block solid rare r90"></div>

    <div class="block triangle lagoon r90"></div>
    <div class="block quarter ember r90"></div>
    <div class="block stripe deepsea r90"></div>
    <div class="block nine sunset r90"></div>
    <div class="block solid epic r180"></div>
    <div class="block triangle berry r180"></div>

    <div class="block quarter gold r180"></div>
    <div class="block stripe candy r180"></div>
    <div class="block nine jewel r180"></div>
    <div class="block solid common r270"></div>
    <div class="block triangle sunset r270"></div>
    <div class="block quarter aqua r270"></div>

    <div class="block stripe deepsea r270"></div>
    <div class="block nine sunset faint"></div>
    <div class="block solid legendary r0"></div>
    <div class="block triangle berry r180"></div>
    <div class="block quarter ember r90"></div>
    <div class="block stripe candy r0"></div>
  </div>
</body>
</html>
