<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Side Quest Quilt</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="quilt">
    <div class="block solid gold r0"></div>
    <div class="block triangle r0"></div>
    <div class="block quarter r0"></div>
    <div class="block stripe r0"></div>
    <div class="block nine r0"></div>
    <div class="block solid green r90"></div>

    <div class="block triangle r90"></div>
    <div class="block quarter r90"></div>
    <div class="block stripe r90"></div>
    <div class="block nine r90"></div>
    <div class="block solid gold r180"></div>
    <div class="block triangle r180"></div>

    <div class="block quarter r180"></div>
    <div class="block stripe r180"></div>
    <div class="block nine r180"></div>
    <div class="block solid green r270"></div>
    <div class="block triangle r270"></div>
    <div class="block quarter r270"></div>

    <div class="block stripe r270"></div>
    <div class="block nine faint"></div>
    <div class="block solid cream r0"></div>
    <div class="block triangle r180"></div>
    <div class="block quarter r90"></div>
    <div class="block stripe r0"></div>
  </div>
</body>
</html>
