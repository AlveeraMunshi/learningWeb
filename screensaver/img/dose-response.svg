<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 150" width="220" height="150" role="img" aria-label="A dose-response curve with the IC50 marked">
  <!-- plot frame -->
  <line x1="34" y1="18" x2="34" y2="118" stroke="#1a1a1a" stroke-width="1.6"/>
  <line x1="34" y1="118" x2="200" y2="118" stroke="#1a1a1a" stroke-width="1.6"/>

  <!-- the sigmoid: response falling as dose climbs -->
  <path d="M 40,32 C 78,32 84,33 100,66 C 116,99 124,104 196,105"
        fill="none" stroke="#e4572e" stroke-width="2.6" stroke-linecap="round"/>

  <!-- IC50 crosshair at the inflection -->
  <line x1="34" y1="68" x2="108" y2="68" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>
  <line x1="108" y1="118" x2="108" y2="68" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>
  <circle cx="108" cy="68" r="3.4" fill="#e4572e"/>

  <!-- measured points, scattered around the fit, because the fit is not the data -->
  <circle cx="54"  cy="30"  r="2.2" fill="#1a1a1a" opacity="0.65"/>
  <circle cx="76"  cy="35"  r="2.2" fill="#1a1a1a" opacity="0.65"/>
  <circle cx="98"  cy="61"  r="2.2" fill="#1a1a1a" opacity="0.65"/>
  <circle cx="112" cy="76"  r="2.2" fill="#1a1a1a" opacity="0.65"/>
  <circle cx="134" cy="98"  r="2.2" fill="#1a1a1a" opacity="0.65"/>
  <circle cx="162" cy="101" r="2.2" fill="#1a1a1a" opacity="0.65"/>

  <text x="113" y="64" font-family="Georgia, serif" font-size="11" fill="#1a1a1a">IC50</text>
  <text x="34" y="136" font-family="Georgia, serif" font-size="9.5" fill="#1a1a1a" opacity="0.7">log [compound]</text>
  <text x="10" y="16" font-family="Georgia, serif" font-size="9.5" fill="#1a1a1a" opacity="0.7">% response</text>
</svg>
