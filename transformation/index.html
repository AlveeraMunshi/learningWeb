<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Again Tomorrow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="sunrise">

    <!-- The sky is one element that changes colour. Everything in it — the
         sun, the moon, the stars, the clouds — moves or fades depending on
         which class the body is wearing. -->
    <div class="sky">
        <div class="stars" id="stars"></div>
        <div class="moon"></div>
        <div class="sun"></div>
        <div class="cloud cloud-one"></div>
        <div class="cloud cloud-two"></div>
        <div class="cloud cloud-three"></div>
        <div class="hill hill-back"></div>
        <div class="hill hill-front"></div>
    </div>

    <nav class="controls">
        <button id="toggle" class="btn">let it go around</button>
        <button id="skip" class="btn ghost">skip ahead</button>
        <span class="readout" id="readout">sunrise, the light coming back</span>
    </nav>

    <script src="js/script.js"></script>
</body>
</html>
