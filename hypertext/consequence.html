<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Life You Chose - Consequence</title>
</head>
<body>
    <h1>The Life You Chose</h1>

    <hr>

    <!-- Show the consequences of the age 40 decision -->
    <h2>[CONSEQUENCE]</h2>
    <h3>The Price of Choosing</h3>

    <!-- Philosophical reflection on the nature of choices -->
    <blockquote>
        <p><em>Every choice has a cost.</em></p>
    </blockquote>

    <p>There are no perfect decisions, only the ones that align with <strong>who you are.</strong></p>

    <!-- ASCII art showing gains and losses -->
    <pre>
      ➕        ➖
    </pre>

    <hr>

    <!-- Display what was gained from the choice -->
    <h2>What You Gained</h2>
    <p id="gain"><em>Loading...</em></p>

    <hr>

    <!-- Display what was lost from the choice -->
    <h2>What You Lost</h2>
    <p id="loss"><em>Loading...</em></p>

    <hr>

    <p><strong><a href="ending.html" id="endingLink">→ Move Forward to Age 70</a></strong></p>

    <script>
        // Extract the consequences and priority info from conflict.html
        const params = new URLSearchParams(window.location.search);
        // get() retrieves the value; || provides a default if not found
        const gain = params.get('gain') || 'Something meaningful';
        const loss = params.get('loss') || 'Something precious';
        const p1 = params.get('p1') || 'ambition';
        const p2 = params.get('p2') || 'love';

        // Display the gain and loss text on the page
        document.getElementById('gain').textContent = gain;
        document.getElementById('loss').textContent = loss;

        // Build link to the ending page, passing along the priority info
        const endingLink = `ending.html?p1=${p1}&p2=${p2}`;
        document.getElementById('endingLink').href = endingLink;
    </script>

</body>
</html>
