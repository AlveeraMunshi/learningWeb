    <circle cx="100" cy="100" r="78" fill="none" stroke="#c9b26b" stroke-width="1" opacity="0.5"/>
    <polygon points="100,20 112,100 100,180 88,100" fill="#d9534f"/>
    <polygon points="20,100 100,88 180,100 100,112" fill="#e8e3d0"/>
    <circle cx="100" cy="100" r="8" fill="#c9b26b"/>
    <text x="100" y="16" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#c9b26b">coffee</text>
    <text x="100" y="196" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#c9b26b">playlist</text>
    <text x="14" y="104" text-anchor="start" font-family="Georgia, serif" font-size="12" fill="#c9b26b">tabs</text>
    <text x="186" y="104" text-anchor="end" font-family="Georgia, serif" font-size="12" fill="#c9b26b">room</text>
